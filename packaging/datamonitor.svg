<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Data Monitor">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2c52"/>
      <stop offset="1" stop-color="#0a1020"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bars" gradientUnits="userSpaceOnUse" x1="24" y1="0" x2="105" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <!-- rounded-square app tile -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <rect width="128" height="128" rx="28" fill="url(#sheen)"/>

  <!-- chart baseline -->
  <rect x="20" y="104" width="88" height="4" rx="2" fill="#ffffff" opacity="0.28"/>

  <!-- usage bars, echoing the in-app history chart -->
  <g fill="url(#bars)">
    <rect x="24" y="80" width="15" height="24" rx="7.5"/>
    <rect x="46" y="64" width="15" height="40" rx="7.5"/>
    <rect x="68" y="48" width="15" height="56" rx="7.5"/>
    <rect x="90" y="32" width="15" height="72" rx="7.5"/>
  </g>

  <!-- live trend line with glowing endpoint -->
  <path d="M31 76 L53 54 L75 40 L97 18" fill="none" stroke="#ffffff"
        stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="97" cy="18" r="13" fill="#ffffff" opacity="0.16"/>
  <circle cx="97" cy="18" r="6.5" fill="#ffffff"/>
</svg>
